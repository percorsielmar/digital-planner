server {
    listen 80;
    listen [::]:80;
    server_name planner.percorsisolari.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name planner.percorsisolari.it;

    ssl_certificate /etc/letsencrypt/live/planner.percorsisolari.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planner.percorsisolari.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/digital-planner/out;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
